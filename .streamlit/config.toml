# Identidade visual do SpotiStats: violeta como destaque, fundos neutros
# O tema claro ou escuro segue a preferência do sistema de quem abre o app

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "medium"
paddingTop = "0.0rem"

[theme.light]
primaryColor = "#5B4FCF"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F3F9"
textColor = "#1E1B2E"
borderColor = "#E3E1EC"

[theme.dark]
primaryColor = "#8F86F0"
backgroundColor = "#0F0E17"
secondaryBackgroundColor = "#1B1928"
textColor = "#EDECF4"
borderColor = "#2E2B40"